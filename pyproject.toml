[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junit-collision-check"
version = "0.2.0a1"
description = "Catch duplicate JUnit test identities and conflicting outcomes across shard reports"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "sunxiuguo"}]
keywords = ["junit", "ci", "test-reports", "sharding", "gitlab"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
junit-collision-check = "junit_collision_check.cli:main"

[project.urls]
Homepage = "https://github.com/sunxiuguo/junit-collision-check"
Issues = "https://github.com/sunxiuguo/junit-collision-check/issues"

[tool.setuptools.packages.find]
include = ["junit_collision_check*"]
