<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">Same identity. Different outcomes.</title><desc id="desc">Audit JUnit XML before a consumer collapses duplicate records. Illustrative workflow, not a screenshot. A collision-free result is not a passing test run.</desc><rect width="900" height="290" rx="18" fill="#101b2b"/><path d="M28 44H60" stroke="#67e8cf" stroke-width="4"/><text x="76" y="51" fill="#a5b6cc" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">WORKFLOW NOTES</text><text x="30" y="96" fill="#f4f7fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Same identity. Different outcomes.</text><text x="30" y="128" fill="#c1cede" font-family="Arial,sans-serif" font-size="18">Audit JUnit XML before a consumer collapses duplicate records.</text><rect x="30" y="152" width="260" height="80" rx="10" fill="#1d2e43" stroke="#3d536d"/><text x="47" y="185" fill="#67e8cf" font-family="Arial,sans-serif" font-size="22" font-weight="700">1. REPORTS</text><text x="47" y="212" fill="#e1e9f5" font-family="Arial,sans-serif" font-size="17">Passed + failed records</text><path d="M297 192h15m-5-5 5 5-5 5" fill="none" stroke="#f5bb70" stroke-width="2"/><rect x="320" y="152" width="260" height="80" rx="10" fill="#1d2e43" stroke="#3d536d"/><text x="337" y="185" fill="#67e8cf" font-family="Arial,sans-serif" font-size="22" font-weight="700">2. GROUP</text><text x="337" y="212" fill="#e1e9f5" font-family="Arial,sans-serif" font-size="17">Your identity + scope</text><path d="M587 192h15m-5-5 5 5-5 5" fill="none" stroke="#f5bb70" stroke-width="2"/><rect x="610" y="152" width="260" height="80" rx="10" fill="#1d2e43" stroke="#3d536d"/><text x="627" y="185" fill="#67e8cf" font-family="Arial,sans-serif" font-size="22" font-weight="700">3. FINDINGS</text><text x="627" y="212" fill="#e1e9f5" font-family="Arial,sans-serif" font-size="17">Collision + source location</text><text x="30" y="266" fill="#a5b6cc" font-family="Arial,sans-serif" font-size="15">Illustrative workflow, not a screenshot. A collision-free result is not a passing test run.</text></svg>
