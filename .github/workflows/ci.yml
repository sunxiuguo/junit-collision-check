name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify XML runtime
        run: python -c "import sys, xml.parsers.expat as e; print(sys.version); print(e.EXPAT_VERSION); assert e.version_info >= (2, 6, 0)"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python -m compileall -q junit_collision_check
      - run: python -m pip install --no-deps .
      - run: junit-collision-check --version
  pytest-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/pytest-ci/requirements.txt
      - name: Verify expected pytest example outcomes
        run: python examples/pytest-ci/demo.py
